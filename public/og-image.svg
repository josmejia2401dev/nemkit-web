<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Nemkit — Un ecosistema para tu negocio</title>
  <desc id="description">Inventory para inventario, ventas y restaurante. Notify para email, SMS y WebPush. Marca con un mangle frondoso.</desc>

  <defs>
