      <stop offset=".52" stop-color="#15332D" />
      <stop offset="1" stop-color="#2B5B51" />
    </linearGradient>
    <radialGradient id="calor" cx=".86" cy=".2" r=".55">
      <stop offset="0" stop-color="#5F8478" stop-opacity=".26" />
      <stop offset="1" stop-color="#5F8478" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="frio" cx=".06" cy=".92" r=".5">
      <stop offset="0" stop-color="#5F8478" stop-opacity=".2" />
      <stop offset="1" stop-color="#5F8478" stop-opacity="0" />
    </radialGradient>
    <g id="mangle">
      <path d="M24 24.5c-2.2 0-4-1.5-4.8-3.4-2.1.5-4.4-.4-5.5-2.2-1.8-.6-3-2.3-2.9-4.1-1.4-1.6-1.5-3.9-.2-5.5.3-2.2 2.1-3.9 4.4-4.1C16.6 3.4 19 2.7 21 3.7c1.9-.9 4.1-.4 5.4 1.1 2.1-.3 4.2.9 4.9 2.9 2.1.5 3.6 2.4 3.6 4.6 1.4 1.5 1.6 3.8.4 5.5-.1 2.2-1.8 4-4 4.3-1 1.6-2.9 2.5-4.8 2.1-.8 1.2-1.6 1.8-2.5 1.8Z" fill="#E7EFE9" />
      <g fill="none" stroke="#E7EFE9" stroke-width="2.3" stroke-linecap="round">
        <path d="M24 24v9.5" />
        <path d="M24 33.5c-3.4 2.4-7.4 3-11.4 1.3" />
        <path d="M24 33.5c3.4 2.4 7.4 3 11.4 1.3" />
        <path d="M24 33.5c-1.4 3.8-4.2 5.9-7.5 6.3" />
        <path d="M24 33.5c1.4 3.8 4.2 5.9 7.5 6.3" />
      </g>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#fondo)" />
  <rect width="1200" height="630" fill="url(#calor)" />
  <rect width="1200" height="630" fill="url(#frio)" />
  <rect x="34" y="34" width="1132" height="562" rx="22" fill="none" stroke="#E7EFE9" stroke-opacity=".18" />

  <g transform="translate(78 62)">
    <rect width="46" height="46" rx="13" fill="#E7EFE9" fill-opacity=".1" stroke="#E7EFE9" stroke-opacity=".35" />
    <use href="#mangle" transform="scale(.98)" />
    <text x="60" y="26" fill="#F4F6F5" font-family="Fraunces, Georgia, serif" font-size="27" font-weight="500">nemkit</text>
    <text x="60" y="41" fill="#E7EFE9" fill-opacity=".6" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2.4">NEGOCIOS CONECTADOS</text>
  </g>

  <g font-family="Fraunces, Georgia, serif" fill="#F4F6F5">
