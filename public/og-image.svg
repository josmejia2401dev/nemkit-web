    <text x="78" y="300" font-size="62" font-weight="300" font-style="italic" letter-spacing="-1.6" fill="#A8C4B8">para tu negocio.</text>
  </g>

  <rect x="78" y="330" width="62" height="2" fill="#5F8478" />

  <g font-family="'DM Sans', Arial, sans-serif" fill="#F4F6F5" fill-opacity=".74" font-size="19">
    <text x="78" y="382">Inventory para inventario, ventas y restaurante.</text>
    <text x="78" y="411">Notify para email, SMS y WebPush. La misma cuenta,</text>
    <text x="78" y="440">la misma forma de trabajar.</text>
  </g>

  <g font-family="'DM Sans', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".6">
    <rect x="78" y="482" width="200" height="38" rx="19" fill="#A8C4B8" />
    <text x="94" y="506" fill="#111A17">INVENTORY DISPONIBLE</text>
    <rect x="290" y="482" width="212" height="38" rx="19" fill="none" stroke="#E7EFE9" stroke-opacity=".34" />
    <text x="306" y="506" fill="#F4F6F5" fill-opacity=".78">NOTIFY PRÓXIMAMENTE</text>
