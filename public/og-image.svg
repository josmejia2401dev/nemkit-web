    <circle r="130" fill="none" stroke="#E7EFE9" stroke-opacity=".16" />
    <rect x="-100" y="-100" width="200" height="200" rx="54" fill="#E7EFE9" fill-opacity=".09" stroke="#E7EFE9" stroke-opacity=".2" />
