<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header id="inicio" class="site-header">
  <a class="brand" routerLink="/" aria-label="Nemkit, inicio" (click)="closeMenu()">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path
          d="M24 24.5c-2.2 0-4-1.5-4.8-3.4-2.1.5-4.4-.4-5.5-2.2-1.8-.6-3-2.3-2.9-4.1-1.4-1.6-1.5-3.9-.2-5.5.3-2.2 2.1-3.9 4.4-4.1C16.6 3.4 19 2.7 21 3.7c1.9-.9 4.1-.4 5.4 1.1 2.1-.3 4.2.9 4.9 2.9 2.1.5 3.6 2.4 3.6 4.6 1.4 1.5 1.6 3.8.4 5.5-.1 2.2-1.8 4-4 4.3-1 1.6-2.9 2.5-4.8 2.1-.8 1.2-1.6 1.8-2.5 1.8Z"
          fill="#E7EFE9"
        />
        <g stroke="#E7EFE9" stroke-width="2.2" stroke-linecap="round">
          <path d="M24 24v9.5" />
          <path d="M24 33.5c-3.4 2.4-7.4 3-11.4 1.3" />
          <path d="M24 33.5c3.4 2.4 7.4 3 11.4 1.3" />
          <path d="M24 33.5c-1.4 3.8-4.2 5.9-7.5 6.3" />
          <path d="M24 33.5c1.4 3.8 4.2 5.9 7.5 6.3" />
        </g>
      </svg>
    </span>
    <span class="brand-name">nemkit<span>negocios conectados</span></span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-navigation"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
  >
    <span></span><span></span>
  </button>

  <nav
    id="main-navigation"
    class="main-nav"
    [class.main-nav--open]="menuOpen()"
    aria-label="Principal"
  >
    <a routerLink="/inventory" routerLinkActive="is-active" (click)="closeMenu()">Inventory</a>
    <a routerLink="/restaurant" routerLinkActive="is-active" (click)="closeMenu()">Restaurant</a>
    <a routerLink="/" fragment="plataforma" (click)="closeMenu()">Plataforma</a>

    <details class="nav-dropdown">
      <summary class="nav-login">Iniciar sesión</summary>
      <div class="nav-dropdown-menu">
        <a [href]="inventory.loginUrl">Inventory</a>
        <a [href]="restaurant.loginUrl">Restaurant</a>
      </div>
    </details>

    <details class="nav-dropdown">
      <summary class="button button-small nav-cta">Crear cuenta</summary>
      <div class="nav-dropdown-menu">
        <a [href]="inventory.registerUrl">Inventory</a>
        <a [href]="restaurant.registerUrl">Restaurant</a>
      </div>
    </details>
  </nav>
</header>
